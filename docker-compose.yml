services:
  ainovel:
    image: ghcr.io/voocel/ainovel-cli:latest
    build:
      context: .
    environment:
      AINOVEL_HOME: /root/.ainovel
    volumes:
      - ./config:/root/.ainovel
      - ./workspace:/workspace
    stdin_open: true
    tty: true

  ainovel-web:
    # Always build the cloned source, including its Web UI, rather than pulling upstream.
    image: ainovel-cli:local
    pull_policy: build
    build:
      context: .
    init: true
    command: ["web", "--addr", "0.0.0.0:5173"]
    environment:
      AINOVEL_HOME: /root/.ainovel
    ports:
      # Local-only: the Web UI has no user authentication.
      - "127.0.0.1:${AINOVEL_WEB_PORT:-5173}:5173"
    volumes:
      - ./config:/root/.ainovel
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Platform services (plan Phase 1). Optional — `ainovel` / `ainovel-web` above run
  # standalone without these. Bring up with: docker compose --profile platform up
  postgres:
    image: postgres:16-alpine
    profiles: ["platform"]
    environment:
      POSTGRES_USER: ainovel
      POSTGRES_PASSWORD: ainovel
      POSTGRES_DB: ainovel_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ainovel-worker:
    image: ghcr.io/voocel/ainovel-cli:latest
    build:
      context: .
    profiles: ["platform"]
    entrypoint: ["ainovel-worker"]
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://ainovel:ainovel@postgres:5432/ainovel_platform?sslmode=disable
      # Provider credentials for every job this worker runs — see .ainovel/eval-configs/
      # for the shape (same bootstrap.Config JSON the eval harness loads). Never commit
      # the real file; mount your own here.
      AINOVEL_CONFIG: /platform/config.json
      WORKSPACE_ROOT: /workspace/platform
      CHAPTER_ROOT: /workspace/chapters
      # System-wide cost cap (plan's "cost layer 3"): once today's usage_ledger spend
      # reaches this, the worker stops claiming new jobs until it resets at midnight —
      # queued jobs wait, they don't fail. 0/unset = unlimited.
      DAILY_BUDGET_USD: "20"
      # Phase 5 (monetization): "model tốt hơn cho vai Writer" for tier=paid jobs. Left
      # unset here on purpose — there's no real pricing/model decision yet (see
      # docs/platform/roadmap.md's Phase 5). Both must be set together or not at all.
      # PAID_WRITER_PROVIDER: ""
      # PAID_WRITER_MODEL: ""
    volumes:
      - ./config/platform.json:/platform/config.json:ro
      - ./workspace:/workspace

volumes:
  pgdata:
